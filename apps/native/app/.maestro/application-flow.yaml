appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
- runFlow: utils/sign-in.yaml
- runFlow:
    file: 'utils/select-tab.yaml'
    env:
      title: 'Meira'

- tapOn:
    id: 'MORE_CARD_APPLICATIONS'
- assertVisible: 'Ókláraðar umsóknir.*'
- tapOn:
    text: '.*Sjá allt.*'
- assertVisible:
    id: 'SCREEN_APPLICATIONS_DETAILS'
- assertVisible:
    id: 'APPLICATION_ITEM'
- tapOn:
    text: 'Opna umsókn'
- assertVisible:
    id: 'SCREEN_PASSKEY'
- tapOn: 'Sleppa'
# Skipping the passkey screen opens the application in the in-app browser
# after a short delay, so wait for it and dismiss it before going back.
- runFlow:
    when:
      platform: 'android'
    commands:
      - extendedWaitUntil:
          notVisible:
            id: 'SCREEN_APPLICATIONS_DETAILS'
          timeout: 10000
      - back
- runFlow:
    when:
      platform: 'ios'
    commands:
      - extendedWaitUntil:
          visible: 'Done|Lokið'
          timeout: 10000
      - tapOn: 'Done|Lokið'
- assertVisible:
    id: 'SCREEN_APPLICATIONS_DETAILS'
- runFlow: 'utils/back.yaml'
