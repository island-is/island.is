query StepUpSession {
  stepUpSession {
    unlocked
    expiresAt
    idleSeconds
  }
}

mutation StepUpStart($method: StepUpMethod) {
  stepUpStart(method: $method) {
    stepUpId
    method
    availableMethods
    verificationCode
    interval
    expiresIn
  }
}

mutation StepUpStatus($stepUpId: ID!) {
  stepUpStatus(stepUpId: $stepUpId)
}

mutation StepUpLock {
  stepUpLock
}
