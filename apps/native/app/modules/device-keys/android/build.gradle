plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'island.devicekeys'
version = '1.0.0'

android {
  namespace "island.devicekeys"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Same version as expo-local-authentication so Gradle resolves one copy.
  implementation "androidx.biometric:biometric:1.2.0-alpha04"
}
