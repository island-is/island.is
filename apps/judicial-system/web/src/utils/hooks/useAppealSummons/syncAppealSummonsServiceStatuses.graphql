mutation SyncAppealSummonsServiceStatuses($caseId: String!) {
  syncAppealSummonsServiceStatuses(caseId: $caseId) {
    id
    services {
      id
      defendantId
      civilClaimantId
      sentToServiceDate
      externalPoliceDocumentId
      serviceStatus
      serviceDate
      servedBy
      comment
    }
  }
}
