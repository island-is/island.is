mutation LimitedAccessUpdateCase($input: UpdateCaseInput!) {
  limitedAccessUpdateCase(input: $input) {
    id
    court {
      ...InstitutionFields
    }
    prosecutor {
      ...UserFields
    }
    judge {
      ...UserFields
    }
    registrar {
      ...UserFields
    }
    civilClaimants {
      ...CivilClaimantFields
    }
  }
}
