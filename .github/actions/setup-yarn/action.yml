name: 'Setup yarn'
description: 'Yarn setup and install dependencies'
inputs:
  working-directory:
    description: 'Directory to run the action in'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    # Node comes from the ARC runner image (island-is/infrastructure
    # `internal-services/actions-runner/Dockerfile`), which must have the exact version of
    # `engines.node` in package.json. Fails here when they differ: bump the runner image together
    # with package.json.
    - name: Check node version
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: |
        set -euo pipefail
        expected="v$(jq -r '.engines.node' package.json)"
        actual="$(node -v)"
        ls -l "$(which node)"
        if [[ "$actual" != "$expected" ]]; then
          echo "::error title=Node version::The runner has Node $actual, package.json wants $expected. Update NODE_VERSION in the ARC runner image (island-is/infrastructure internal-services/actions-runner/Dockerfile)."
          exit 1
        fi
        echo "Node $actual"

    - name: Corepack
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        corepack enable
        yarn --version

    - name: Get Cache Directory Paths
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      id: cache-paths
      run: |
        echo "yarn-cache=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
        # Set output only if cypress exists (empty otherwise)
        CYPRESS_CACHE_FOLDER=
        if jq -e '(.dependencies // {}) * (.devDependencies // {}) | keys | .[] | select(. == "cypress")' package.json; then
          CYPRESS_CACHE_FOLDER="${{ runner.temp }}/.cypress-cache"
        fi
        echo "CYPRESS_CACHE_FOLDER=$CYPRESS_CACHE_FOLDER" | tee -a "$GITHUB_ENV"
        echo "cypress-cache=$CYPRESS_CACHE_FOLDER" | tee -a "$GITHUB_OUTPUT"
    - name: Cache Dependencies
      uses: runs-on/cache@v5
      id: restore-cache
      with:
        path: |
          ${{ steps.cache-paths.outputs.yarn-cache }}
          ${{ steps.cache-paths.outputs.cypress-cache }}
          ${{ inputs.working-directory }}/node_modules
        key: ${{ runner.os }}-deps-${{ steps.cache-paths.outputs.cypress-cache && 'cypress' || '' }}-${{ hashFiles(format('{0}/yarn.lock', inputs.working-directory)) }}-1-node_modules
      env:
        AWS_REGION: ${{ env.AWS_REGION || 'eu-west-1' }}
        RUNS_ON_S3_BUCKET_CACHE: shared-islandis-github-actions-cache

    - name: Yarn install
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      if: ${{ steps.restore-cache.outputs.cache-hit != 'true' }}
      run: |
        yarn install --immutable
        if [[ -n "$CYPRESS_CACHE_FOLDER" ]]; then yarn cypress install; fi
