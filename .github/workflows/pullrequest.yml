name: Monorepo pipeline - pull request

# Runs lint, typecheck, build, test and e2e as one distributed Nx Cloud CI run: the `main` job
# orchestrates and the `agents` jobs (our own runners) execute the tasks, see
# `scripts/ci/nx-agents/README.md`.
#
# The pipeline this replaced (the `legacy-*` jobs) runs instead for pull requests with the
# `legacy-ci` label. Labels are read when a run is triggered, so push after adding the label.
#
# The `success` job is the required status check, and together with its `Announce success` step
# and the `pr-event` artifact it is how `.github/actions/ci-io.ts` finds the last good run.

on:
  pull_request: {}
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

concurrency:
  # See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-using-a-fallback-value
  group: pullrequest-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  COMPOSE_HTTP_TIMEOUT: 180
  SKIP_GENERATED_CACHE: ${{ contains(github.event.pull_request.labels.*.name, 'skip-generated-cache') }}
  NX_AFFECTED_ALL: ${{ contains(github.event.pull_request.labels.*.name, 'nx-affected-all') }}
  NX_SKIP_NX_CACHE: ${{ contains(github.event.pull_request.labels.*.name, 'skip-nx-cache') }}
  NX_PARALLEL: '3'
  NX_TASKS_RUNNER: ci
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  # Ties the main job and the agents of this attempt together. Only the steps that take part in
  # the distributed run use it as NX_CI_EXECUTION_ID. Everything else (e.g. codegen in load-deps)
  # gets an id of its own: any nx command creates the CI execution in Nx Cloud, and when the job
  # that created it ends the execution is closed, so agents exit and the main job fails
  NX_AGENTS_EXECUTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-agents
  NX_BRANCH: ${{ github.event.pull_request.number || github.ref_name }}
  # The `web` build output is over Nx Cloud's 300MB artifact limit. Without agents that is
  # only a warning (the build is just never cached), but an agent has to upload the output
  # of every task it runs. Remove when `.next/cache` is no longer part of the build outputs
  NX_CLOUD_NO_TIMEOUTS: 'true'
  MIN_AGENTS: '1'
  MAX_AGENTS: '10'
  # Judicial tasks run on agents of their own, see `scripts/ci/nx-agents/assignment-rules.yaml`
  MAX_JUDICIAL_AGENTS: '2'
  SHARED_RUNNER: arc-shared
  JUDICIAL_RUNNER: arc-shared
  AWS_REGION: eu-west-1
  GENERATED_FILES: ${{ github.sha }}.tar.gz
  AFFECTED_ALL: ${{ secrets.AFFECTED_ALL }}
  SERVERSIDE_FEATURES_ON: ''
  DOCKER_REGISTRY: 821090935708.dkr.ecr.eu-west-1.amazonaws.com
  DOCKER_BASE_IMAGE_REGISTRY: 821090935708.dkr.ecr.eu-west-1.amazonaws.com/ecr-public
  CI_DEBUG: ${{ contains(github.event.pull_request.labels.*.name, 'ci debug') }}
  SKIP_TESTS: ${{ contains(github.event.pull_request.labels.*.name, 'test nothing') }}
  DEPLOY_FEATURE: ${{ contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
  YARN_ENABLE_HARDENED_MODE: '0'
  # Only used by the legacy jobs
  DISABLE_CHUNKS: 'true'
  DISABLE_GROUPING: 'false'
  DISABLE_PROBLEMATIC: 'false'
  CHUNK_SIZE: '8'
  MAX_JOBS: '3'
  NX_MAX_PARALLEL: '4'

jobs:
  plan:
    # Every job of the distributed pipeline needs this one, so this is the only place to check the label
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'legacy-ci') }}
    runs-on: arc-shared
    timeout-minutes: 30
    env:
      NX_CI_EXECUTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-plan
    permissions:
      contents: 'read'
      actions: 'read'
    outputs:
      NX_BASE: ${{ steps.export-sha.outputs.NX_BASE }}
      NX_HEAD: ${{ steps.export-sha.outputs.NX_HEAD }}
      agents: ${{ steps.plan.outputs.agents }}
      agent-count: ${{ steps.plan.outputs.agent-count }}
      nx-args: ${{ steps.plan.outputs.nx-args }}
      targets: ${{ steps.plan.outputs.targets }}
      unicorn-projects: ${{ steps.plan.outputs.unicorn-projects }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # Need full repo for Nx to find the commits at NX_*
          fetch-depth: 0

      - name: Setup yarn
        uses: ./.github/actions/setup-yarn

      # The main job and the agents all start after this job, so make sure the
      # generated files cache is warm instead of having each of them run codegen
      - name: load-deps
        uses: ./.github/actions/load-deps

      - name: Derive appropriate SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: ${{ github.base_ref || 'main' }}

      - name: Set base/head sha output
        id: export-sha
        run: |
          echo "NX_BASE=$NX_BASE" >> "$GITHUB_OUTPUT"
          echo "NX_HEAD=$NX_HEAD" >> "$GITHUB_OUTPUT"
          echo "Current base SHA is $NX_BASE and head SHA is $NX_HEAD"
          echo "{\"base_sha\": \"$NX_BASE\", \"head_sha\":\"$NX_HEAD\"}" > event.json

      # This is to increase the retention days for our GitHub Actions run events
      # See this for more information:
      # https://github.blog/changelog/2020-10-08-github-actions-ability-to-change-retention-days-for-artifacts-and-logs/
      - name: Keep PR run event
        uses: actions/upload-artifact@b18b1d32f3f31abcdc29dee3f2484801fe7822f4
        with:
          name: pr-event
          path: event.json
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error

      - name: test-everything
        uses: ./.github/actions/test-everything

      - name: Plan Nx command and agents
        id: plan
        run: node scripts/ci/nx-agents/plan.mjs

  agents:
    name: Nx agent ${{ matrix.agent }}
    needs:
      - plan
    if: ${{ needs.plan.outputs.agent-count != '0' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # agent (name), type (shared/judicial), runner, test and e2e (does the agent run such tasks)
        include: ${{ fromJson(needs.plan.outputs.agents) }}
    env:
      NX_CI_EXECUTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-agent-${{ matrix.agent }}-setup
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup yarn
        uses: ./.github/actions/setup-yarn

      - name: load-deps
        uses: ./.github/actions/load-deps

      - name: Docker login to ECR repo
        if: ${{ matrix.test }}
        run: ./scripts/ci/docker-login-ecr.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DOCKER_REGISTRY: 821090935708.dkr.ecr.eu-west-1.amazonaws.com/

      - name: Configure Datadog Test Optimization
        if: ${{ matrix.test }}
        uses: datadog/test-visibility-github-action@v2
        with:
          languages: 'js'
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.eu

      - name: Setup Playwright
        if: ${{ matrix.e2e }}
        uses: ./.github/actions/setup-playwright

      - name: Start Nx agent
        run: ./scripts/ci/nx-agents/start-agent.sh
        env:
          NX_CI_EXECUTION_ID: ${{ env.NX_AGENTS_EXECUTION_ID }}
          NX_AGENT_NAME: ${{ matrix.agent }}
          # The agent type in `scripts/ci/nx-agents/assignment-rules.yaml`
          NX_AGENT_LAUNCH_TEMPLATE: ${{ matrix.type }}
          DOCKER_REGISTRY: 821090935708.dkr.ecr.eu-west-1.amazonaws.com/
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          CYPRESS_PROJECT_ID: 4q7jz8
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      - name: Upload coverage reports to Datadog
        if: ${{ !cancelled() && matrix.test }}
        run: |
          if [[ -d coverage ]]; then
            yarn datadog-ci coverage upload .
          else
            echo "No tests with coverage ran on this agent"
          fi
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: datadoghq.eu

  main:
    name: Nx main job
    needs:
      - plan
    runs-on: arc-shared
    timeout-minutes: 60
    permissions:
      contents: 'read'
      actions: 'read'
    env:
      NX_BASE: ${{ needs.plan.outputs.NX_BASE }}
      NX_HEAD: ${{ needs.plan.outputs.NX_HEAD }}
      NX_CLOUD_DISTRIBUTED_EXECUTION_AGENT_COUNT: ${{ needs.plan.outputs.agent-count }}
      NX_CI_EXECUTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-main-setup
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # Need full repo for Nx to find the commits at NX_*
          fetch-depth: 0

      - name: Setup yarn
        uses: ./.github/actions/setup-yarn

      - name: load-deps
        uses: ./.github/actions/load-deps

      # "Re-run failed jobs" does not re-run the agents
      - name: Check that the agents are part of this attempt
        if: ${{ github.run_attempt > 1 && needs.plan.outputs.agent-count != '0' }}
        run: ./scripts/ci/nx-agents/check-agents.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Start distributed CI run
        if: ${{ needs.plan.outputs.agent-count != '0' }}
        # Knowing every target of the run lets Nx Cloud stop agents as they run out of
        # work, instead of all of them idling until the longest task is done
        #
        # Completion is explicit (see the last step) instead of relying on Nx Cloud's background
        # heartbeat process, which Nx advises against in pipelines with multiple jobs
        run: >-
          npx nx-cloud start-ci-run
          --distribute-on="manual"
          --assignment-rules="scripts/ci/nx-agents/assignment-rules.yaml"
          --stop-agents-after="$TARGETS"
          --require-explicit-completion
        env:
          NX_CI_EXECUTION_ID: ${{ env.NX_AGENTS_EXECUTION_ID }}
          TARGETS: ${{ needs.plan.outputs.targets }}

      - name: Run lint, typecheck, build, test and e2e on the agents
        run: ./scripts/ci/nx-agents/run.sh
        env:
          NX_CI_EXECUTION_ID: ${{ env.NX_AGENTS_EXECUTION_ID }}
          NX_AGENTS_ARGS: ${{ needs.plan.outputs.nx-args }}

      # Agents wait for work until the run is completed, also when this job fails or is cancelled
      - name: Complete CI run
        if: ${{ always() && needs.plan.outputs.agent-count != '0' }}
        run: npx nx-cloud complete-ci-run
        env:
          NX_CI_EXECUTION_ID: ${{ env.NX_AGENTS_EXECUTION_ID }}

  unicorn-tests:
    name: All projects have some tests
    needs:
      - plan
    if: ${{ needs.plan.outputs.unicorn-projects != '' }}
    runs-on: arc-shared
    env:
      projects: ${{ needs.plan.outputs.unicorn-projects }}
      # Listing tests is not something to distribute or cache, so keep it out of the agents' CI execution
      NX_CI_EXECUTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-unicorn-tests
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup yarn
        uses: ./.github/actions/setup-yarn

      - name: load-deps
        uses: ./.github/actions/load-deps

      - name: Verify that projects have some tests
        run: |
          # Get list of tests, with `<project-name>: ` prefixed (stream style, without cache), grouping by unique prefixes (sorted).
          # NO_COLOR=1: Nx 22 (picocolors) forces ANSI colour on the stream prefix in CI even when stdout is piped,
          # so lines start with escape codes instead of the project name and the anchored grep below matches nothing.
          NO_COLOR=1 yarn nx run-many -t test --skip-nx-cache --output-style=stream --projects="${projects}" --parallel --verbose -- --listTests |
            grep -P "^(${projects//,/|}): " | cut -d':' -f1 | sort -u > /tmp/projects-with-tests
          # Get affected projects sorted
          echo -e "${projects}" | sed 's/,/\n/g' | sort -u > /tmp/projects-all
          if ! d=$(diff /tmp/projects-with-tests /tmp/projects-all); then
            echo "These projects don't have any tests:"
            echo "${d}"
            exit 1
          fi
          echo "All projects ($projects) have tests."

  # The jobs below are not Nx tasks (or push commits), so they run next to either pipeline

  run-shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          fail_level: info
          exclude: >-
            */node_modules/*

  formatting:
    needs:
      - plan
      - legacy-prepare
    # One of the two is always skipped
    if: ${{ !cancelled() && (needs.plan.result == 'success' || needs.legacy-prepare.result == 'success') }}
    runs-on: arc-shared
    timeout-minutes: 15
    env:
      NX_BASE: ${{ needs.plan.outputs.NX_BASE || needs.legacy-prepare.outputs.NX_BASE }}
      NX_CI_EXECUTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-formatting
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          # Need full repo for Nx to find the commits at NX_*
          fetch-depth: 0

      - name: Setup yarn
        uses: ./.github/actions/setup-yarn

      - name: NX format:write
        env:
          DIRTYBOT_KEY: ${{ secrets.ISLAND_IS_SSH_KEY }}
          DIRTYBOT_APP_ID: ${{ secrets.ISLAND_IS_APP_KEY }}
        run: |
          yarn nx format:write
          node scripts/ci/docker/git-check-dirty.mjs "." "format" "dirtybot"

  lintfix-changed-files:
    name: Lintfix Changed Files
    runs-on: arc-shared
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'dirty bypass') }}
    env:
      NX_CI_EXECUTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-lintfix
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need full repo for Nx to find the commits at NX_* below
          fetch-depth: 0
          persist-credentials: false
          # Need ref to know where to push to
          # https://github.com/actions/checkout#push-a-commit-to-a-pr-using-the-built-in-token
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup yarn
        uses: ./.github/actions/setup-yarn

      - name: Run lintfix
        id: lintfix
        # NOTE: We want to use the PR base, not last good, since the lint is not part of "good" build
        # and causes unintended lint changes when using a different commit
        run: |
          yarn nx affected -t lint --base="origin/$GITHUB_BASE_REF" --fix
          if ! git diff "$GITHUB_BASE_REF" --exit-code; then
            echo "FILES_CHANGED=true" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Commit changed files
        if: ${{ steps.lintfix.outputs.FILES_CHANGED == 'true' }}
        env:
          DIRTYBOT_KEY: ${{ secrets.ISLAND_IS_SSH_KEY }}
          DIRTYBOT_APP_ID: ${{ secrets.ISLAND_IS_APP_KEY }}
        run: node scripts/ci/docker/git-check-dirty.mjs "." "lintfix" "dirtybot"

  # The pipeline from before Nx Agents, for pull requests with the `legacy-ci` label.
  # Every legacy job needs `legacy-prepare`, so this is the only place to check the label

  legacy-prepare:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'legacy-ci') }}
    permissions:
      contents: 'read'
      actions: 'read'
    uses: ./.github/workflows/install.yml
    secrets: inherit
    with:
      main_branch: ${{ github.base_ref }}

  legacy-tests:
    needs:
      - legacy-prepare
    if: ${{ needs.legacy-prepare.outputs.TEST_CHUNKS && needs.legacy-prepare.outputs.DEPLOY_FEATURE == 'false' }}
    runs-on: arc-shared
    timeout-minutes: 45
    env:
      AFFECTED_PROJECTS: ${{ matrix.projects }}
      NX_BASE: ${{ needs.legacy-prepare.outputs.NX_BASE }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.legacy-prepare.outputs.TEST_CHUNKS) }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup yarn
        uses: ./.github/actions/setup-yarn

      - name: load-deps
        uses: ./.github/actions/load-deps

      - name: Run unit tests
        uses: ./.github/actions/unit-test
        with:
          dd-api-key: '${{ secrets.DD_API_KEY }}'
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          docker-registry: 821090935708.dkr.ecr.eu-west-1.amazonaws.com/

  legacy-unicorn-tests:
    name: All projects have some tests (legacy)
    needs:
      - legacy-prepare
    if: ${{ needs.legacy-prepare.outputs.TEST_CHUNKS && needs.legacy-prepare.outputs.DEPLOY_FEATURE == 'false' && needs.legacy-prepare.outputs.is-unicorn == 'true' }}
    runs-on: arc-shared
    env:
      CHUNKS: ${{ needs.legacy-prepare.outputs.TEST_CHUNKS }}
      NX_BASE: ${{ needs.legacy-prepare.outputs.NX_BASE }}
      NX_HEAD: ${{ needs.legacy-prepare.outputs.NX_HEAD }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # Need full repo for Nx to find the commits at NX_* below
          fetch-depth: 0

      - name: Setup yarn
        uses: ./.github/actions/setup-yarn

      - name: load-deps
        uses: ./.github/actions/load-deps

      - name: Find unicorn projects
        id: unicorn
        run: |
          unicorns=$(node scripts/ci/unicorn-utils.mjs show-unicorns --json)
          jq -ncr --argjson chunks "$CHUNKS" --argjson unicorns "$unicorns" '
            [
                $chunks.projects
              | .[]
              | select( . | IN( $unicorns | .[] ) )
            ]
            | "projects=\(. | join(","))"
          ' | tee -a "$GITHUB_OUTPUT"

      - name: Verify that projects have some tests
        if: ${{ steps.unicorn.outputs.projects != '' }}
        env:
          projects: ${{ steps.unicorn.outputs.projects }}
        run: |
          # Get list of tests, with `<project-name>: ` prefixed (stream style, without cache), grouping by unique prefixes (sorted).
          # NO_COLOR=1: Nx 22 (picocolors) forces ANSI colour on the stream prefix in CI even when stdout is piped,
          # so lines start with escape codes instead of the project name and the anchored grep below matches nothing.
          NO_COLOR=1 yarn nx run-many -t test --skip-nx-cache --output-style=stream --projects="${projects}" --parallel --verbose -- --listTests |
            grep -P "^(${projects//,/|}): " | cut -d':' -f1 | sort -u > /tmp/projects-with-tests
          # Get affected projects sorted
          echo -e "${projects}" | sed 's/,/\n/g' | sort -u > /tmp/projects-all
          if ! d=$(diff /tmp/projects-with-tests /tmp/projects-all); then
            echo "These projects don't have any tests:"
            echo "${d}"
            exit 1
          fi
          echo "All projects ($projects) have tests."

  legacy-e2e:
    uses: ./.github/workflows/e2e.yml
    needs:
      - legacy-prepare
    if: ${{ needs.legacy-prepare.outputs.E2E_CHUNKS && needs.legacy-prepare.outputs.DEPLOY_FEATURE == 'false' }}
    secrets: inherit
    with:
      e2e_build_id: '${{ needs.legacy-prepare.outputs.E2E_BUILD_ID }}-${{ github.run_attempt }}'
      nx_base: ${{ needs.legacy-prepare.outputs.NX_BASE }}
      nx_head: ${{ needs.legacy-prepare.outputs.NX_HEAD }}
      affected_projects: ${{ matrix.projects }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.legacy-prepare.outputs.E2E_CHUNKS) }}

  legacy-linting-workspace:
    needs:
      - legacy-prepare
    runs-on: arc-shared
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup yarn
        uses: ./.github/actions/setup-yarn

      - name: load-deps
        uses: ./.github/actions/load-deps

      - name: Linting workspace
        run: ./scripts/ci/20_lint-workspace.sh

  legacy-linting:
    needs:
      - legacy-prepare
    runs-on: arc-shared
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NX_BASE: ${{ needs.legacy-prepare.outputs.NX_BASE }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Fetch NX_BASE commit
        run: git fetch --depth=1 origin ${{ needs.legacy-prepare.outputs.NX_BASE }}

      - name: Setup yarn
        uses: ./.github/actions/setup-yarn

      - name: Linting
        run: yarn nx affected --target=lint

  legacy-typecheck:
    needs:
      - legacy-prepare
    permissions:
      contents: 'read'
    runs-on: arc-shared
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NX_BASE: ${{ needs.legacy-prepare.outputs.NX_BASE }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Fetch NX_BASE commit
        run: git fetch --depth=1 origin ${{ needs.legacy-prepare.outputs.NX_BASE }}

      - name: Setup yarn
        uses: ./.github/actions/setup-yarn

      - name: load-deps
        uses: ./.github/actions/load-deps

      # The vite builds do not type check (unlike the webpack builds they
      # replaced), so projects with a typecheck target are checked here.
      - name: Type checking
        run: yarn nx affected --target=typecheck

  legacy-build:
    needs:
      - legacy-prepare
    runs-on: arc-shared
    timeout-minutes: 35
    env:
      AFFECTED_PROJECTS: ${{ matrix.projects }}
      NX_BASE: ${{ needs.legacy-prepare.outputs.NX_BASE }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.legacy-prepare.outputs.BUILD_CHUNKS) }}
    if: ${{ needs.legacy-prepare.outputs.BUILD_CHUNKS && needs.legacy-prepare.outputs.DEPLOY_FEATURE == 'false' }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup yarn
        uses: ./.github/actions/setup-yarn

      - name: load-deps
        uses: ./.github/actions/load-deps

      - name: Building
        run: ./scripts/ci/run-in-parallel-native.sh build

  success:
    runs-on: arc-shared
    if: ${{ !cancelled() }}
    needs:
      - plan
      - agents
      - main
      - unicorn-tests
      - run-shellcheck
      - formatting
      - legacy-prepare
      - legacy-linting-workspace
      - legacy-tests
      - legacy-linting
      - legacy-typecheck
      - legacy-e2e
      - legacy-build
      - legacy-unicorn-tests
    steps:
      - name: Notify about deploy-feature label
        if: ${{ github.event.pull_request.auto_merge && env.DEPLOY_FEATURE == 'true' }}
        run: |
          echo "- 👉 Remove the \`deploy-feature\` label if you want this PR to be merged automatically" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Collect
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # "failed" here is everything that wasn't successful or skipped (e.g. "failure", "cancelled")
          failed_dependencies=$(jq -nr --argjson needs "$NEEDS" ' $needs | with_entries(select(.value.result != "success" and .value.result != "skipped")) ')
          echo -n "Did any dependency fail? "
          if jq -ne --argjson failures "$failed_dependencies" '$failures | length > 0'; then
            failure_statuses=$(jq -nr --argjson failures "$failed_dependencies" '[ $failures | to_entries | .[] | "\(.key) (\(.value.result))" ] | join(", ")')
            echo "::error title=NEEDS::Some dependencies failed: $failure_statuses"
            exit 1
          fi
          # Skipped jobs are fine, as long as one of the two pipelines did run
          echo -n "Did a pipeline run? "
          if ! jq -ne --argjson needs "$NEEDS" '[$needs.main, $needs["legacy-prepare"]] | any(.result == "success")'; then
            echo "::error title=NEEDS::Neither the Nx Agents nor the legacy pipeline ran"
            exit 1
          fi
          echo "::info title=NEEDS::No failing dependencies 🎉"
          exit 0

      - name: Announce success
