name: TEMP Trivy image timing

# TEMPORARY: times the merge-queue Trivy steps on real images.
# Delete before merge.

on:
  push:
    branches:
      - feat/trivy-scanning
    paths:
      - .github/workflows/tmp-trivy-image-timing.yml

permissions:
  contents: read

env:
  DOCKER_REGISTRY: 821090935708.dkr.ecr.eu-west-1.amazonaws.com
  AWS_REGION: eu-west-1

jobs:
  scan:
    name: scan (${{ matrix.image }})
    runs-on: arc-mergequeue
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - service-portal:dev_72e6eb0_Yc7puH4nYUUotloo
          - application-system-api:release_2026.11.24.00_c7161fe_zEotouu0ul6upBXU
          - api:dev_0cdaa6c_T6KForgS1Vqu00fu
          - web:dev_b5c066b_juvO8lKBctLcSvfo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Docker login to ECR repo
        run: ./scripts/ci/docker-login-ecr.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Same three steps as merge-queue.yml docker-build.
      - name: Trivy image report
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_IMAGE_SRC: remote
        with:
          version: v0.76.2
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ matrix.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          trivy-config: trivy.yaml
          cache-dir: ${{ runner.temp }}/trivy-cache
          format: table
          output: trivy-image.txt

      - name: Trivy summary
        if: always()
        run: |
          {
            echo "### Trivy: ${{ matrix.image }} (HIGH/CRITICAL, fixable)"
            echo '```'
            head -c 500000 trivy-image.txt 2>/dev/null || echo "No report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy CVE gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_IMAGE_SRC: remote
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ matrix.image }}
          scanners: vuln
          severity: CRITICAL
          trivy-config: trivy.yaml
          cache-dir: ${{ runner.temp }}/trivy-cache
          exit-code: 1

      - name: Trivy secrets gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_IMAGE_SRC: remote
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ matrix.image }}
          scanners: secret
          trivy-config: trivy.yaml
          cache-dir: ${{ runner.temp }}/trivy-cache
          exit-code: 1
