name: External checks

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      # The title and the description of the pull request are checked as well
      - edited
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

concurrency:
  group: external-checks-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # All the quick checks of a pull request share one job (and runner). It is named after the first
  # one that was here since that is the name of the required status check. The steps run even
  # when an earlier one failed, so every problem is reported at once
  codeowners-check:
    name: Lint CODEOWNERS
    runs-on: arc-shared
    env:
      CHECK: 'false'
    steps:
      - name: Lint PR title
        if: ${{ github.event_name == 'pull_request' }}
        uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            feat
            infra
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}
        with:
          fetch-depth: 0
          # All commits and trees, but only the files of this commit
          filter: blob:none

      - name: Validate PR AI disclosure
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          PR_BODY="$(node -e "const event = require(process.env.GITHUB_EVENT_PATH); process.stdout.write(event.pull_request?.body ?? '')")"
          export PR_BODY
          node scripts/ci/validate-pr-ai-disclosure.mjs

      - name: Check if codeowners file changed
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          MERGE_BASE="$(git merge-base "${{github.event.pull_request.base.sha}}" "$GITHUB_SHA")"
          if ! git diff --exit-code --name-only "$MERGE_BASE".."$GITHUB_SHA" .github/CODEOWNERS; then
            echo "CHECK=true" >> "$GITHUB_ENV"
            if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
              echo "Changes to codeowners are not allowed on forks!"
              exit 1
            fi
          fi
      - name: Setup yarn
        if: ${{ !cancelled() && env.CHECK == 'true' }}
        uses: ./.github/actions/setup-yarn
      - name: Get token
        id: get-token
        if: ${{ !cancelled() && env.CHECK == 'true' }}
        shell: bash
        env:
          APP_ID: ${{ secrets.ISLAND_IS_APP_KEY }}
          PRIVATE_KEY: ${{ secrets.ISLAND_IS_SSH_KEY }}
        run: |
          node scripts/ci/docker/get-github-token.mjs
      - name: Check indentation
        if: ${{ !cancelled() && env.CHECK == 'true' }}
        run: |
          set -euo pipefail
          no_different_indentations="$(grep -v '^#' .github/CODEOWNERS | awk NF | sed s/@.*//g | awk '{ print length }' | sort | uniq | wc -l)"
          if [[ "$no_different_indentations" != "1" ]]; then
            echo "CODEOWNERS has $no_different_indentations different indentations."
            echo "Make sure that all teams start in the same column."
            grep -v '^#' .github/CODEOWNERS | awk NF
            exit 1
          fi
      - name: Codeowners validation
        if: ${{ !cancelled() && env.CHECK == 'true' }}
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/mszostok/codeowners-validator/main/install.sh | sh -s -- -b "$HOME" v0.7.2
          REPOSITORY_PATH="." \
          GITHUB_ACCESS_TOKEN="$GH_TOKEN" \
          EXPERIMENTAL_CHECKS="notowned" \
          CHECKS="files,owners,duppatterns" \
          OWNER_CHECKER_REPOSITORY="island-is/island.is" \
          ~/codeowners-validator
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}
