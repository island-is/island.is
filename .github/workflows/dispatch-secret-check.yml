name: Dispatch secret check

# Sends the pushed commit SHA to the secret-checker SQS queue so the
# always-on secret-checker pod can run a check against that commit.
#
# Fully independent of push.yml / config-values.yaml: it is a standalone
# workflow, never a required check or a dependency of build/deploy, so it
# cannot gate or delay any other pipeline.

on:
  push:
    branches:
      - main
      - feat/dispatch-secret-check

concurrency:
  group: main
  cancel-in-progress: false
  queue: max

permissions:
  id-token: write # for AWS OIDC
  contents: read

jobs:
  dispatch:
    runs-on: arc-shared
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.SECRET_CHECKER_DISPATCH_ROLE_ARN }}
          role-session-name: dispatch-secret-check
          role-duration-seconds: 900

      - name: Send commit SHA to secret-checker queue
        env:
          QUEUE_URL: ${{ secrets.SECRET_CHECKER_SQS_QUEUE_URL }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          aws sqs send-message \
            --queue-url "$QUEUE_URL" \
            --message-body "$(jq -nc --arg sha "$SHA" '{type:"check-commit",sha:$sha}')"
