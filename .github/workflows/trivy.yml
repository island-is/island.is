name: Trivy

# Repo scan: secrets, Dockerfiles, IaC. Lockfile CVEs are Dependabot's.
# Own workflow, so it never waits on or delays the PR / merge-queue
# pipelines. Results: Security -> Code scanning. PRs only flag NEW
# alerts, compared with the latest main analysis (push + nightly).
# Image scans run in each merge-queue.yml docker-build leg.

on:
  pull_request: {}
  push:
    branches:
      - main
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch: {}

concurrency:
  group: trivy-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # v0.36.0. Pinned by SHA: tags were hijacked in March 2026.
      - name: Scan repo (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          scan-type: fs
          scanners: secret,misconfig
          trivy-config: trivy.yaml
          cache-dir: ${{ runner.temp }}/trivy-cache
          format: sarif
          output: trivy.sarif

      # v4.39.5
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-repo

      # Gate: any committed secret, all severities.
      - name: Secrets gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          skip-setup-trivy: true
          scan-type: fs
          scanners: secret
          trivy-config: trivy.yaml
          cache-dir: ${{ runner.temp }}/trivy-cache
          exit-code: 1

      - name: Misconfig gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          skip-setup-trivy: true
          scan-type: fs
          scanners: misconfig
          severity: CRITICAL
          trivy-config: trivy.yaml
          cache-dir: ${{ runner.temp }}/trivy-cache
          exit-code: 1
