name: Retry lost runners

# Re-runs a pipeline when one of its jobs was lost with its runner ("The runner has received a
# shutdown signal"), which is nothing a pull request can do anything about.
#
# The pipelines that run on Nx Agents are re-run as a whole: a distributed run does not survive
# without all of its jobs, and what was done is not done again (tasks are cache hits, and images
# that are in the registry are not built again).
#
# Like every `workflow_run` workflow this runs as it is on the default branch.

on:
  workflow_run:
    workflows:
      - Monorepo pipeline - pull request
      - Monorepo pipeline - build and deploy
    types:
      - completed

jobs:
  retry:
    # A run can end as cancelled when it is the main job that is lost
    if: >-
      ${{
        (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled') &&
        github.event.workflow_run.run_attempt < 3
      }}
    runs-on: arc-shared
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
    steps:
      - name: Re-run if a runner was lost
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const run = context.payload.workflow_run
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRunAttempt,
              { owner, repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100 },
            )
            const lost = []
            for (const job of jobs) {
              if (!['failure', 'cancelled'].includes(job.conclusion)) continue
              // The message of the runner is an annotation of the job, a job that is cancelled with
              // its run (e.g. by a new push) has none
              const annotations = await github.paginate(
                github.rest.checks.listAnnotations,
                { owner, repo, check_run_id: job.id, per_page: 100 },
              )
              if (annotations.some((a) => a.message?.includes('received a shutdown signal'))) {
                lost.push(job.name)
              }
            }
            if (lost.length === 0) {
              core.info('No job of this run was lost with its runner')
              return
            }
            core.notice(`Lost with their runner: ${lost.join(', ')}. Re-running attempt ${run.run_attempt} of ${run.html_url}`)
            try {
              await github.rest.actions.reRunWorkflow({ owner, repo, run_id: run.id })
            } catch (error) {
              // Somebody was faster, or a new push replaced the run
              core.warning(`Could not re-run: ${error.message}`)
            }
