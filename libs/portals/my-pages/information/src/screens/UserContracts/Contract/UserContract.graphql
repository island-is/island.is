fragment Party on HmsContractParty {
  id
  type
  name
}

query UserContract($id: ID!) {
  hmsRentalAgreement(contractId: $id) {
    id
    status
    signatureDate
    dateFrom
    dateTo
    terminationDate
    contractProperty {
      id
      propertyId
      type
      streetAndHouseNumber
      municipality
      postalCode
    }
    landlords {
      ...Party
    }
    tenants {
      ...Party
    }
    latestDocumentDownloadUrl
    canTerminate
  }
}
