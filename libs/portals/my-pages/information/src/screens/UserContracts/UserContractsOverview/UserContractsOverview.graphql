query UserContractsOverview($input: HmsGetRentalAgreementsInput) {
  hmsRentalAgreements(input: $input) {
    data {
      id
      status
      contractType
      contractProperty {
        id
        propertyId
        type
        streetAndHouseNumber
        municipality
        postalCode
      }
    }
    pageInfo {
      hasNextPage
    }
    totalCount
  }
}
