query UserContractsOverview($input: HmsRentalAgreementsInput!) {
  hmsRentalAgreements(input: $input) {
    data {
      id
      status
      contractProperty {
        id
        propertyId
        type
        streetAndHouseNumber
        municipality
        postalCode
      }
    }
    totalCount
    pageSize
  }
}
