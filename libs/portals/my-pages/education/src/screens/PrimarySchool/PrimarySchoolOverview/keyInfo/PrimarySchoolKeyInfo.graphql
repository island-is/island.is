fragment PrimarySchoolAgentFields on EducationPrimarySchoolAgent {
  id
  person {
    nationalId
    name
  }
  relationType {
    id
    title {
      is
      en
    }
  }
  createdBy {
    kind
    displayName
    at
  }
  canEdit
}

fragment PrimarySchoolLanguageProfileFields on EducationPrimarySchoolLanguageProfile {
  languageEnvironment {
    id
    code
    title {
      is
      en
    }
  }
  preferredLanguage
  languages
  interpreter
  signLanguage
  updatedAt
  updatedBy {
    kind
    displayName
  }
}

fragment PrimarySchoolHealthProfileFields on EducationPrimarySchoolHealthProfile {
  epipen
  medicalDiagnoses
  medicationAssistance
  allergies {
    id
    code
    type
    title {
      is
      en
    }
  }
  updatedAt
  updatedBy {
    kind
    displayName
  }
}

# The key-information reads hang off the student, so they are addressed by the
# routed studentId and the api resolves the MMS child behind it.
#
# All three sections are read in one request. Every key-info field resolver has
# to translate the student into a frigg child id, and that translation is a
# `listChildren` call deduplicated by a per-request DataLoader — so splitting
# the sections across requests costs one extra `listChildren` per request
# (my-pages uses a plain HttpLink, with no query batching). The caller selects
# the sections it actually reads with the three flags: the overview takes all
# three, an edit screen takes one.
#
# Read with errorPolicy 'all' so a section that fails comes back as a null field
# plus an error keyed on its path, and the sections that succeeded still render
# (see usePrimarySchoolKeyInfo). Every field selected here is nullable, so a
# failure never nulls `primarySchoolStudent` itself: that null would be written
# to the cache under the root field this query shares with the base info and
# assessment reads, and would blank those too. A failed child-id lookup shows up
# as an error on `hasKeyInfo`, which the hook reports as the one read-level
# error.
query PrimarySchoolKeyInfoSections(
  $studentId: String!
  $withEmergencyContacts: Boolean!
  $withLanguageProfile: Boolean!
  $withHealthProfile: Boolean!
) {
  primarySchoolStudent(studentId: $studentId) {
    id
    hasKeyInfo
    emergencyContacts @include(if: $withEmergencyContacts) {
      ...PrimarySchoolAgentFields
    }
    languageProfile @include(if: $withLanguageProfile) {
      ...PrimarySchoolLanguageProfileFields
    }
    healthProfile @include(if: $withHealthProfile) {
      ...PrimarySchoolHealthProfileFields
    }
  }
}

query PrimarySchoolContactIdentity($input: IdentityInput!) {
  identity(input: $input) {
    nationalId
    name
  }
}

query PrimarySchoolAgentRelationTypes {
  primarySchoolAgentRelationTypes {
    id
    relation
    title {
      is
      en
    }
  }
}

query PrimarySchoolAllergies {
  primarySchoolAllergies {
    id
    code
    type
    title {
      is
      en
    }
  }
}

query PrimarySchoolLanguageEnvironments {
  primarySchoolLanguageEnvironments {
    id
    code
    title {
      is
      en
    }
  }
}

mutation PrimarySchoolAddAgent($input: EducationPrimarySchoolAddAgentInput!) {
  primarySchoolAddAgent(input: $input) {
    ...PrimarySchoolAgentFields
  }
}

mutation PrimarySchoolUpdateAgent(
  $input: EducationPrimarySchoolUpdateAgentInput!
) {
  primarySchoolUpdateAgent(input: $input) {
    ...PrimarySchoolAgentFields
  }
}

mutation PrimarySchoolDeleteAgent(
  $input: EducationPrimarySchoolDeleteAgentInput!
) {
  primarySchoolDeleteAgent(input: $input)
}

mutation PrimarySchoolUpdateLanguageProfile(
  $input: EducationPrimarySchoolUpdateLanguageProfileInput!
) {
  primarySchoolUpdateLanguageProfile(input: $input) {
    ...PrimarySchoolLanguageProfileFields
  }
}

mutation PrimarySchoolUpdateHealthProfile(
  $input: EducationPrimarySchoolUpdateHealthProfileInput!
) {
  primarySchoolUpdateHealthProfile(input: $input) {
    ...PrimarySchoolHealthProfileFields
  }
}

# Whether the child exists in the frigg key-info database at all — the student
# hub uses it to decide whether the overview tab has anything to show.
query PrimarySchoolStudentHasKeyInfo($studentId: String!) {
  primarySchoolStudent(studentId: $studentId) {
    id
    hasKeyInfo
  }
}
