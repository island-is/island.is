fragment PrimarySchoolAgentFields on EducationPrimarySchoolAgent {
  id
  person {
    nationalId
    name
  }
  relationType {
    id
    title
  }
  createdBy {
    kind
    displayName
    at
  }
  canEdit
}

fragment PrimarySchoolLanguageProfileFields on EducationPrimarySchoolLanguageProfile {
  languageEnvironment {
    id
    code
    title
  }
  preferredLanguage
  languages
  interpreter
  signLanguage
  updatedAt
  updatedBy {
    kind
    displayName
  }
}

fragment PrimarySchoolHealthProfileFields on EducationPrimarySchoolHealthProfile {
  epipen
  medicalDiagnoses
  medicationAssistance
  allergies {
    id
    code
    type
    title
  }
  updatedAt
  updatedBy {
    kind
    displayName
  }
}

# All three sections in one request: every key-info field resolver translates
# the student into a frigg child id first, so splitting them costs an extra
# `listChildren` per request (my-pages uses a plain HttpLink, no batching). The
# three flags select the sections the caller actually reads.
#
# Every field selected here is nullable on purpose. Read with errorPolicy 'all'
# (see usePrimarySchoolKeyInfo), a failing non-nullable field would null
# `primarySchoolStudent` itself — and that null is cached under the root field
# this query shares with the base info and assessment reads, blanking those too.
query PrimarySchoolKeyInfoSections(
  $studentId: String!
  $locale: String!
  $withEmergencyContacts: Boolean!
  $withLanguageProfile: Boolean!
  $withHealthProfile: Boolean!
) {
  primarySchoolStudent(studentId: $studentId) {
    id
    hasKeyInfo
    emergencyContacts(locale: $locale) @include(if: $withEmergencyContacts) {
      ...PrimarySchoolAgentFields
    }
    languageProfile(locale: $locale) @include(if: $withLanguageProfile) {
      ...PrimarySchoolLanguageProfileFields
    }
    healthProfile(locale: $locale) @include(if: $withHealthProfile) {
      ...PrimarySchoolHealthProfileFields
    }
  }
}

query PrimarySchoolContactIdentity($input: IdentityInput!) {
  identity(input: $input) {
    nationalId
    name
  }
}

query PrimarySchoolAgentRelationTypes($locale: String!) {
  primarySchoolAgentRelationTypes(locale: $locale) {
    id
    relation
    title
  }
}

query PrimarySchoolAllergies($locale: String!) {
  primarySchoolAllergies(locale: $locale) {
    id
    code
    type
    title
  }
}

query PrimarySchoolLanguageEnvironments($locale: String!) {
  primarySchoolLanguageEnvironments(locale: $locale) {
    id
    code
    title
  }
}

mutation PrimarySchoolAddAgent(
  $input: EducationPrimarySchoolAddAgentInput!
  $locale: String!
) {
  primarySchoolAddAgent(input: $input, locale: $locale) {
    ...PrimarySchoolAgentFields
  }
}

mutation PrimarySchoolUpdateAgent(
  $input: EducationPrimarySchoolUpdateAgentInput!
  $locale: String!
) {
  primarySchoolUpdateAgent(input: $input, locale: $locale) {
    ...PrimarySchoolAgentFields
  }
}

mutation PrimarySchoolDeleteAgent(
  $input: EducationPrimarySchoolDeleteAgentInput!
) {
  primarySchoolDeleteAgent(input: $input)
}

mutation PrimarySchoolUpdateLanguageProfile(
  $input: EducationPrimarySchoolUpdateLanguageProfileInput!
  $locale: String!
) {
  primarySchoolUpdateLanguageProfile(input: $input, locale: $locale) {
    ...PrimarySchoolLanguageProfileFields
  }
}

mutation PrimarySchoolUpdateHealthProfile(
  $input: EducationPrimarySchoolUpdateHealthProfileInput!
  $locale: String!
) {
  primarySchoolUpdateHealthProfile(input: $input, locale: $locale) {
    ...PrimarySchoolHealthProfileFields
  }
}

# Whether the child exists in the frigg key-info database at all — the student
# hub uses it to decide whether the overview tab has anything to show.
query PrimarySchoolStudentHasKeyInfo($studentId: String!) {
  primarySchoolStudent(studentId: $studentId) {
    id
    hasKeyInfo
  }
}
