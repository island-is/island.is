query EducationOwnContact {
  educationOwnContact {
    email
    phone
  }
}

mutation EducationUpdateOwnContact($input: EducationUpdateOwnContactInput!) {
  educationUpdateOwnContact(input: $input) {
    email
    phone
  }
}

query EducationProfileContact {
  getUserProfile {
    email
    mobilePhoneNumber
  }
}
