query GetVmstApplicantIncomeRows($locale: String) {
  vmstApplicantIncomeRows(locale: $locale) {
    __typename
    id
    type
    period {
      from
      to
    }
    estimatedIncome
    ... on VmstApplicantIrregularJob {
      employerName
      employerSSN
    }
    ... on VmstApplicantPartTimeJob {
      employerName
      employerSSN
      ratio
    }
    ... on VmstApplicantPensionPayment {
      employerName
      incomeTypeId
      pensionFundId
    }
    ... on VmstApplicantCapitalIncomePayment {
      incomeTypeId
      incomeTypeName
    }
    ... on VmstApplicantTRPayment {
      incomeTypeId
    }
  }
}
