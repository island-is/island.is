query getUnemploymentApplicationOverview($locale: String) {
  vmstApplicationsUnemploymentApplicationOverview(locale: $locale) {
    applicantId
    unemploymentApplicationId
    applicationStatusId
    applicationStatusName
    applicationStatus
    dataRequested
    jobSearchConfirmationStatus {
      canConfirm
      hasConfirmed
    }
    overviewItems {
      key
      label
      value
    }
  }
}

query getApplicantAvailableActions {
  vmstApplicantAvailableActions {
    canContact
    canSubmitDocuments
    canReportWork
    canReportTravel
    canUnregister
  }
}

query getApplicantOverview($locale: String) {
  vmstApplicantOverview(locale: $locale) {
    passCode
    preferredJobs
    bankAccount
    union
    pensionFund
    usedPersonalTaxCredit
    numberOfChildren
    employmentHistory
    educationHistory
    drivingLicenses
    languageAbilities {
      name
      proficiency
    }
    serviceArea
    currentAddressDifferent
    savedToEures
  }
}
