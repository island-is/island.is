query GetHealthTreatmentsOverview {
  healthDirectorateTreatments {
    id
    name
    organizationName
    departmentName
  }
}

query GetHealthTreatment($id: ID!) {
  healthDirectorateTreatment(id: $id) {
    id
    name
    organizationName
    departmentName
    supportsMessaging
    responsibleNode
    lastQuestionnaireSentAt
    lastDocumentSentAt
    recentConversations {
      id
      title
      lastMessageSentAt
      senderName
    }
  }
}
