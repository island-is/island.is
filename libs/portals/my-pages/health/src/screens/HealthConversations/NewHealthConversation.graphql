fragment HealthConversationOpeningWindow on HealthDirectorateHealthConversationOpeningWindow {
  windowOpen
  windowClose
  isAllDay
}

fragment HealthConversationRecipient on HealthDirectorateHealthConversationRecipient {
  nodeId
  groupId
  treatmentId
  name
  availability
  closesAt
  todaysWindow {
    ...HealthConversationOpeningWindow
  }
  nextOpensAt {
    date
    windowOpen
  }
  openingHours {
    weekday {
      ...HealthConversationOpeningWindow
    }
    weekend {
      ...HealthConversationOpeningWindow
    }
    holiday {
      ...HealthConversationOpeningWindow
    }
  }
  canRequestCertificate
  allowedMessageTypes {
    patientInitiatedTypeCode
    title
    description
    instructions
    isCertificate
    externalLinkUrl
  }
}

query GetHealthConversationRecipientsForNew($locale: LocaleEnum) {
  healthDirectorateHealthConversationRecipients(locale: $locale) {
    ...HealthConversationRecipient
  }
}

mutation CreateHealthConversation(
  $input: HealthDirectorateCreateConversationInput!
) {
  healthDirectorateCreateHealthConversation(input: $input) {
    id
  }
}

mutation CreateHealthCertificateRequest(
  $input: HealthDirectorateCreateCertificateRequestInput!
) {
  healthDirectorateCreateCertificateRequest(input: $input) {
    id
    conversationId
  }
}
