query getAppointments($input: HealthDirectoratePaginatedAppointmentsInput) {
  healthDirectoratePaginatedAppointments(input: $input) {
    data {
      __typename
      id
      title
      date
      status
      duration
      modality
      practitioners
      assignees {
        type
        name
      }
      location {
        __typename
        name
        organization
        address
        city
        latitude
        longitude
      }
    }
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
