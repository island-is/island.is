query DirectorateOfEqualitySubmissions(
  $input: DirectorateOfEqualitySubmissionsInput!
) {
  directorateOfEqualitySubmissions(input: $input) {
    items {
      id
      type
      status
      submittedVia
      identifier
      submittedAt
      approvedAt
      validUntil
      salaryDataPeriod
    }
  }
}
