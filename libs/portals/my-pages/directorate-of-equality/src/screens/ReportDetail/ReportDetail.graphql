query DirectorateOfEqualityReport($input: DirectorateOfEqualityDetailInput!) {
  directorateOfEqualityReport(input: $input) {
    id
    status
    identifier
    submittedAt
    approvedAt
    companies {
      name
      nationalId
    }
    salaryDataBasis
    salaryDataPeriod
    pdfUrl
    improvementPlanPdfUrl
    adjustedGap {
      percent
      direction
      benchmarkPercent
      withinBenchmark
      outlierCount
    }
    rawGap {
      percent
      direction
    }
    meanHourlyWage {
      male
      female
    }
    distribution {
      points {
        score
        wage
        gender
        marked
      }
      markedKind
      expectedLine {
        score
        wage
      }
      increasePer100PointsPercent
      expectedWageAtMeanScore
    }
    improvementPlan {
      id
      name
      reason
      correctionPlan
      deadline
      responsibleName
      responsibleTitle
    }
  }
}
