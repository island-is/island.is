query DirectorateOfEqualityEqualityPlan(
  $input: DirectorateOfEqualityDetailInput!
) {
  directorateOfEqualityEqualityPlan(input: $input) {
    id
    status
    identifier
    submittedAt
    approvedAt
    validUntil
    companies {
      name
      nationalId
    }
    documentFileName
    hasPdf
  }
}
