query DirectorateOfEqualityAvailableServiceProviders {
  directorateOfEqualityAvailableServiceProviders {
    items {
      id
      name
      nationalId
    }
  }
}

mutation DirectorateOfEqualityGrantServiceProvider(
  $input: DirectorateOfEqualityGrantServiceProviderInput!
) {
  directorateOfEqualityGrantServiceProvider(input: $input) {
    success
  }
}
