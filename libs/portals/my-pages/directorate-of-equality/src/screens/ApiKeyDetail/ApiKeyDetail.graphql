query DirectorateOfEqualityApiKeyDetail {
  directorateOfEqualityApiKeys {
    items {
      id
      keyId
      type
      label
      createdAt
      createdByName
      createdByDirectorate
      expiresAt
      lastUsedAt
      revokedAt
    }
  }
}

mutation DirectorateOfEqualityRevokeApiKey(
  $input: DirectorateOfEqualityRevokeApiKeyInput!
) {
  revokeDirectorateOfEqualityApiKey(input: $input) {
    success
  }
}
