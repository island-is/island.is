query DirectorateOfEqualityServiceProviderDetail {
  directorateOfEqualityServiceProviders {
    items {
      id
      name
      nationalId
      grantedAt
      grantedByName
    }
  }
}

mutation DirectorateOfEqualityRevokeServiceProvider(
  $input: DirectorateOfEqualityRevokeServiceProviderInput!
) {
  revokeDirectorateOfEqualityServiceProvider(input: $input) {
    success
  }
}
