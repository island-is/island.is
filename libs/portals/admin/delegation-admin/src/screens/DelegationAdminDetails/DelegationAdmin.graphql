query getCustomDelegationsAdmin($nationalId: String!) {
  authAdminDelegationAdmin(nationalId: $nationalId) {
    name
    nationalId
    incoming {
      id
      validTo
      indexedAt
      referenceId
      domain {
        name
        organisationLogoKey
        organisationLogoUrl
        displayName
        nationalId
      }
      type
      from {
        name
        nationalId
      }
      to {
        name
        nationalId
      }
      createdBy {
        name
        nationalId
      }
      scopes {
        name
        displayName
        id
        validFrom
        validTo
      }
    }
    outgoing {
      id
      validTo
      indexedAt
      referenceId
      domain {
        name
        organisationLogoKey
        organisationLogoUrl
        displayName
        nationalId
      }
      type
      from {
        name
        nationalId
      }
      to {
        name
        nationalId
      }
      createdBy {
        name
        nationalId
      }
      scopes {
        name
        displayName
        id
        validFrom
        validTo
      }
    }
  }
}

mutation deleteCustomDelegationAdmin($id: String!) {
  authDeleteAdminDelegation(id: $id)
}
