query AuthScopeCategories(
  $lang: String!
  $direction: AuthDelegationDirection
  $requestCatalog: Boolean
  $requestGrantorType: String
) {
  authScopeCategories(
    lang: $lang
    direction: $direction
    requestCatalog: $requestCatalog
    requestGrantorType: $requestGrantorType
  ) {
    id
    title
    description
    slug
    scopes {
      name
      displayName
      description
      allowsWrite
      domain {
        name
        displayName
        organisationLogoUrl
      }
    }
  }
}

