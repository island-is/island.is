fragment AuthDelegationConfirmationFields on AuthDelegationConfirmation {
  id
  status
  toNationalId
  toName
  domainDisplayName
  bindingMessage
  expiresAt
  confirmedAt
  scopes {
    name
    displayName
    validTo
  }
}

query AuthDelegationConfirmation($input: AuthDelegationConfirmationInput!) {
  authDelegationConfirmation(input: $input) {
    ...AuthDelegationConfirmationFields
  }
}

mutation AuthStartDelegationConfirmationAuthentication(
  $input: AuthStartDelegationConfirmationAuthenticationInput!
) {
  authStartDelegationConfirmationAuthentication(input: $input) {
    method
    availableMethods
    verificationCode
    interval
    expiresIn
  }
}

mutation AuthCheckDelegationConfirmationAuthentication(
  $input: AuthDelegationConfirmationInput!
) {
  authCheckDelegationConfirmationAuthentication(input: $input) {
    status
    confirmation {
      ...AuthDelegationConfirmationFields
    }
  }
}
