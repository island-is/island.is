openapi: 3.0.4
info:
  title: Rsk.Services.Kilometragjald - Kilometer Fee
  version: v1
servers:
  - url: /ws/Kilometragjald
security:
  - bearerAuth: []
paths:
  /kilometer-fee/{permno}:
    get:
      tags: [KilometerFee]
      operationId: getKilometerFee
      parameters:
        - $ref: '#/components/parameters/permno'
        - $ref: '#/components/parameters/year'
      responses:
        '200':
          description: OK. A year with no periods returns an empty periods list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KilometerFee'
        '400':
          $ref: '#/components/responses/ProblemDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not found, or not the owner
  /kilometer-fee/{permno}/export:
    get:
      tags: [KilometerFee]
      operationId: getKilometerFeeExport
      parameters:
        - $ref: '#/components/parameters/permno'
        - $ref: '#/components/parameters/year'
      responses:
        '200':
          description: OK
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ProblemDetails'
        '401':
          description: Unauthorized
        '404':
          description: Not found, or not the owner
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    permno:
      name: permno
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z0-9]{2,6}$'
    year:
      name: year
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 2024
  responses:
    ProblemDetails:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    YearMonth:
      type: object
      required: [year, month]
      properties:
        year:
          type: integer
          format: int32
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
    DifferenceOutcome:
      type: string
      enum: [Refunded, AddedToNextInvoice, Reversed]
    KilometerFeePeriod:
      type: object
      required:
        [
          year,
          month,
          provisionalPayment,
          settlementPayment,
          difference,
          differenceOutcome,
          description,
        ]
      properties:
        year:
          type: integer
          format: int32
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        provisionalPayment:
          type: integer
          format: int32
        settlementPayment:
          type: integer
          format: int32
          nullable: true
          description: Null until settled
        difference:
          type: integer
          format: int32
          nullable: true
        differenceOutcome:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DifferenceOutcome'
        description:
          type: string
          nullable: true
    KilometerFee:
      type: object
      required:
        [
          permno,
          firstRegistration,
          periods,
          provisionalPaymentTotal,
          settlementPaymentTotal,
          reversalThreshold,
        ]
      properties:
        reversalThreshold:
          type: integer
          format: int32
          description: Differences below this amount are reversed
        permno:
          type: string
        firstRegistration:
          $ref: '#/components/schemas/YearMonth'
        periods:
          type: array
          items:
            $ref: '#/components/schemas/KilometerFeePeriod'
        provisionalPaymentTotal:
          type: integer
          format: int32
        settlementPaymentTotal:
          type: integer
          format: int32
    ProblemDetails:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
