query GetTemplateByTemplateId($templateId: String!, $locale: String!) {
  hnippTemplateCollection(where: { templateId: $templateId }, locale: $locale) {
    items {
      templateId
      title: notificationTitle
      externalBody: notificationBody
      internalBody: notificationDataCopy
      clickActionUrl
      scope
      args
      smsPayer
      smsDelivery
      priorityType
      hnippCategory
      hnippCategoryIs: hnippCategory(locale: "is-IS")
    }
  }
}

query GetTemplates($locale: String!) {
  hnippTemplateCollection(locale: $locale, limit: 1000) {
    items {
      templateId
      title: notificationTitle
      externalBody: notificationBody
      internalBody: notificationDataCopy
      clickActionUrl
      scope
      args
      smsPayer
      smsDelivery
      priorityType
      hnippCategory
    }
  }
}

query GetTemplateCategories($templateIds: [String]!) {
  hnippTemplateCollection(
    where: { templateId_in: $templateIds }
    limit: 1000
  ) {
    items {
      categoryIs: hnippCategory(locale: "is-IS")
      categoryEn: hnippCategory(locale: "en")
    }
  }
}

query GetOrganizationByNationalId($nationalId: String!, $locale: String!) {
  organizationCollection(where: { kennitala: $nationalId }, locale: $locale) {
    items {
      title
    }
  }
}
