comment:
  layout: 'reach, diff, flags, files, header, footer, feedback'
  behavior: default
github_checks: false
coverage:
  status:
    project: false
    patch: false
flag_management:
  default_rules:
    carryforward: true
component_management:
  default_rules: # default rules that will be inherited by all components
    statuses:
      - type: project # in this case every component that doens't have a status defined will have a project type one
        target: auto
        informational: true
        branches:
          - '!main'
  individual_components:
    - component_id: judicial-system
      name: Judicial System
      paths:
        - apps/judicial-system/**
        - libs/judicial-system/**
    - component_id: react-libs
      name: React shared libraries
      paths:
        - libs/react/**
        - libs/shared/**
    - component_id: nest-libs
      name: NestJS shared libraries
      paths:
        - libs/nest/**
        - libs/auth-nest-tools/**
    - component_id: island-ui
      name: Island UI
      paths:
        - libs/island-ui/**
