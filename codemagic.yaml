definitions:
  base: &base
    max_build_duration: 120
    working_directory: apps/native/app
    when:
      changeset:
        includes:
          - 'apps/native/app'
    # To save on build minutes, workflows are currently triggered manually and/or once per day.
    #  default_triggers: &default_triggers
    #    events:
    #      - push
    #    branch_patterns:
    #      - pattern: "main"
    #        include: true
    #        source: true
  environment: &environment
    node: 24.10.0
  shared_envs: &shared_envs
    XCODE_WORKSPACE: 'IslandApp.xcworkspace'
    XCODE_SCHEME: 'IslandApp'
    CM_CLONE_DEPTH: 200
    NODE_OPTIONS: '--max-old-space-size=8192'
  caches:
    ios_cache: &ios_cache
      cache_paths:
        - ~/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/.yarn/cache
        - $CM_BUILD_DIR/.cache/nx
    android_cache: &android_cache
      cache_paths:
        - ~/.gradle/caches
        - $CM_BUILD_DIR/.yarn/cache
        - $CM_BUILD_DIR/.cache/nx
  scripts:
    - &check_changes
      name: Check changes since last build
      working_directory: .
      script: |
        set -e

        echo "Considering changes between $CM_PREVIOUS_COMMIT and $CM_COMMIT"
        if git cat-file -e "$CM_PREVIOUS_COMMIT"^{commit} >& /dev/null; then
          notes=$(git log --pretty=format:"%s (%an)" "$CM_PREVIOUS_COMMIT".."$CM_COMMIT" -- codemagic.yaml apps/native/app)
          if [[ $notes == "" ]]; then
            echo "No changes detected in native app. Exiting."
            exit 1
          else
            echo "App changes since last build:"
            echo "$notes" | tee apps/native/app/release_notes_en-US.txt
          fi
        else
          echo "No previous commit detected. Continuing."
        fi
    - &pip_install
      name: Install distutils with pip
      script: |
        pip3 install --upgrade setuptools
        python3 -c "import distutils; print(distutils.__file__)"
    - &npm_install
      name: Install npm dependencies
      working_directory: .
      script: |
        corepack enable
        corepack prepare
        yarn install --immutable
    - &codegen
      name: Run codegen
      working_directory: .
      script: |
        yarn codegen
    - &prebuild_ios
      name: Expo prebuild for iOS
      script: |
        npx expo prebuild --platform ios --clean
    - &prebuild_android
      name: Expo prebuild for Android
      script: |
        echo $ANDROID_FIREBASE_SECRET > assets/firebase/google-services.json
        npx expo prebuild --platform android --clean
    - &cocoapods
      name: Install CocoaPods dependencies
      script: |
        cd ios && pod install
    - &set_android_location
      name: Prepare Android configuration
      script: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
    - &provisioning_profiles
      name: Set up provisioning profiles settings on Xcode project
      script: xcode-project use-profiles --project ios/IslandApp.xcodeproj
    - &build_ipa
      name: Build ipa for distribution
      script: |
        xcode-project build-ipa \
          --workspace "ios/$XCODE_WORKSPACE" \
          --scheme "$XCODE_SCHEME"
    - &get_android_version_code
      name: Get latest Android version code
      script: |
        LATEST_GOOGLE_PLAY_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME")
        if [ -z "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" ]; then
            echo "Failed to get build number from Google Play"
            exit 1
        fi
        ANDROID_VERSION_CODE=$(($LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))
        echo "ANDROID_VERSION_CODE=$ANDROID_VERSION_CODE" >> $CM_ENV
        echo "Using Android version code: $ANDROID_VERSION_CODE"
    - &build_android
      name: Build Android release
      script: |
        cd android
        ./gradlew bundleRelease
    - &build_ios_simulator
      name: Build iOS simulator app (Release)
      script: |
        xcodebuild \
          -workspace "ios/$XCODE_WORKSPACE" \
          -scheme "$XCODE_SCHEME" \
          -configuration Release \
          -sdk iphonesimulator \
          -derivedDataPath ios/build \
          ARCHS="arm64" \
          ONLY_ACTIVE_ARCH=YES

        # Zip the .app for devicecloud upload
        APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
        cd "$(dirname "$APP_PATH")"
        zip -r "$CM_BUILD_DIR/IslandApp.zip" "$(basename "$APP_PATH")"
    - &build_android_apk
      name: Build Android release APK
      script: |
        cd android
        ./gradlew assembleRelease
    - &run_devicecloud_ios
      name: Upload iOS to DeviceCloud
      script: |
        npx --yes @devicecloud.dev/dcd@latest cloud \
          "$CM_BUILD_DIR/IslandApp.zip" \
          .maestro/ \
          --apiKey "$DCD_API_KEY" \
          --quiet
    - &run_devicecloud_android
      name: Upload Android to DeviceCloud
      script: |
        APK_PATH=$(find android/app/build/outputs -name "*.apk" -type f | head -1)
        npx --yes @devicecloud.dev/dcd@latest cloud \
          "$APK_PATH" \
          .maestro/ \
          --apiKey "$DCD_API_KEY" \
          --quiet
    # Steps used by the auto-release mobile-release-* workflows. The release
    # worker starts those builds through the Codemagic API and passes the commit
    # and release version as environment variables.
    - &checkout_release_target
      name: Check out the commit auto-release requested
      working_directory: .
      script: |
        set -euo pipefail
        : "${MOBILE_REQUEST_ID:?required}"
        : "${MOBILE_TARGET_SHA:?required}"
        : "${MOBILE_RELEASE_VERSION:?required}"
        if [[ ! "$MOBILE_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "MOBILE_TARGET_SHA must be a full lowercase 40-character SHA" >&2
          exit 1
        fi
        if [[ ! "$MOBILE_RELEASE_VERSION" =~ ^[0-9]{2}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])\.[0-9]{2}$ ]]; then
          echo "MOBILE_RELEASE_VERSION must be yy.mm.dd.nn, got '$MOBILE_RELEASE_VERSION'" >&2
          exit 1
        fi
        # The store marketing version allows three components, so drop the
        # same-day counter (.nn); the build number still tells builds apart.
        # app.config.js reads APP_VERSION during prebuild.
        echo "APP_VERSION=${MOBILE_RELEASE_VERSION%.*}" >> "$CM_ENV"
        echo "Using app version: ${MOBILE_RELEASE_VERSION%.*}"
        printf 'MOBILE_REQUEST_ID=%s\nMOBILE_TARGET_SHA=%s\nMOBILE_RELEASE_VERSION=%s\n' \
          "$MOBILE_REQUEST_ID" "$MOBILE_TARGET_SHA" "$MOBILE_RELEASE_VERSION"
        # Codemagic clones the branch tip; build the exact commit auto-release sent.
        git fetch --no-tags origin "$MOBILE_TARGET_SHA"
        git checkout --detach "$MOBILE_TARGET_SHA"
        test "$(git rev-parse HEAD)" = "$MOBILE_TARGET_SHA"
    # The store build number is the latest number in the variant's store app
    # plus one. Each (platform, variant) store app has its own counter, so the
    # four numbers of one release can differ.
    - &apply_release_android_version_code
      name: Apply next Google Play version code
      script: |
        set -euo pipefail
        : "${PACKAGE_NAME:?required}"
        LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME")
        if [[ ! "$LATEST" =~ ^[0-9]+$ ]]; then
          echo "Failed to get latest version code from Google Play, got '$LATEST'" >&2
          exit 1
        fi
        NEXT=$((LATEST + 1))
        # app.config.js reads ANDROID_VERSION_CODE during prebuild.
        echo "ANDROID_VERSION_CODE=$NEXT" >> "$CM_ENV"
        echo "Latest Google Play version code: $LATEST, using: $NEXT"
    - &apply_release_ios_build_number
      name: Apply next App Store Connect build number
      script: |
        set -euo pipefail
        : "${APP_STORE_APPLE_ID:?required}"
        LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID")
        if [[ ! "$LATEST" =~ ^[0-9]+$ ]]; then
          echo "Failed to get latest build number from App Store Connect, got '$LATEST'" >&2
          exit 1
        fi
        NEXT=$((LATEST + 1))
        cd ios
        agvtool new-version -all "$NEXT"
        echo "Latest App Store Connect build number: $LATEST, using: $NEXT"
  publishing:
    # auto-release iOS builds upload to TestFlight (both dev and prod app
    # records) but never submit for App Store review. Android auto-release
    # builds upload to the Google Play internal track (both dev and prod
    # packages) via the shared android_publishing anchor below.
    ios_release_testflight: &ios_release_testflight
      app_store_connect:
        auth: integration
        submit_to_app_store: false
    android_publishing: &android_publishing
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
    slack_errors: &slack_errors
      slack:
        channel: '#team-app-builds'
        notify:
          # don't want to spam slack with 4 successful builds.
          success: false
          failure: true

workflows:
  e2e-tests-ios:
    <<: *base
    name: Island.is E2E Tests iOS
    instance_type: mac_mini_m2
    cache: *ios_cache
    environment:
      <<: *environment
      ios_signing:
        distribution_type: app_store
        bundle_identifier: is.island.app.dev
      groups:
        - devicecloud
      vars:
        <<: *shared_envs
        BUNDLE_ID: 'is.island.app.dev'
        APP_STORE_APPLE_ID: 1570427360
        APP_VARIANT: 'development'
    scripts:
      - *check_changes
      - *pip_install
      - *npm_install
      - *codegen
      - *prebuild_ios
      - *cocoapods
      - *build_ios_simulator
      - *run_devicecloud_ios

  e2e-tests-android:
    <<: *base
    name: Island.is E2E Tests Android
    instance_type: linux_x2
    cache: *android_cache
    environment:
      <<: *environment
      android_signing:
        - island-upload-keystore
      groups:
        - google_credentials
        - firebase_credentials_dev
        - devicecloud
      vars:
        <<: *shared_envs
        PACKAGE_NAME: 'is.island.app.dev'
        APP_VARIANT: 'development'
    scripts:
      - *check_changes
      - *pip_install
      - *npm_install
      - *codegen
      - *get_android_version_code
      - *prebuild_android
      - *set_android_location
      - *build_android_apk
      - *run_devicecloud_android
    artifacts:
      - android/app/build/outputs/**/*.apk

  # Started only by the auto-release mobile worker. Each release target triggers
  # four builds, one per (platform, variant):
  #   CODEMAGIC_WORKFLOW_ID_IOS_DEV      -> mobile-release-ios-dev
  #   CODEMAGIC_WORKFLOW_ID_IOS_PROD     -> mobile-release-ios-prod
  #   CODEMAGIC_WORKFLOW_ID_ANDROID_DEV  -> mobile-release-android-dev
  #   CODEMAGIC_WORKFLOW_ID_ANDROID_PROD -> mobile-release-android-prod
  # The yy.mm.dd version comes from auto-release; the build number is the
  # store's latest build number plus one (see the apply_release_* steps). iOS variants
  # upload the signed .ipa to TestFlight (dev and prod app records) but never
  # submit for App Store review. Android variants upload the signed .aab to the
  # Google Play internal track.
  mobile-release-ios-dev:
    name: Island.is Mobile Release iOS Dev (auto-release)
    max_build_duration: 120
    working_directory: apps/native/app
    instance_type: mac_mini_m2
    cache: *ios_cache
    integrations:
      app_store_connect: 'Island.is API Key'
    environment:
      <<: *environment
      ios_signing:
        distribution_type: app_store
        bundle_identifier: is.island.app.dev
      vars:
        <<: *shared_envs
        BUNDLE_ID: 'is.island.app.dev'
        APP_STORE_APPLE_ID: 1570427360
        APP_VARIANT: 'development'
    scripts:
      - *checkout_release_target
      - *pip_install
      - *npm_install
      - *codegen
      - *prebuild_ios
      - *cocoapods
      - *provisioning_profiles
      - *apply_release_ios_build_number
      - *build_ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      <<: *ios_release_testflight
      <<: *slack_errors

  mobile-release-ios-prod:
    name: Island.is Mobile Release iOS Prod (auto-release)
    max_build_duration: 120
    working_directory: apps/native/app
    instance_type: mac_mini_m2
    cache: *ios_cache
    integrations:
      app_store_connect: 'Island.is API Key'
    environment:
      <<: *environment
      ios_signing:
        distribution_type: app_store
        bundle_identifier: is.island.app
      vars:
        <<: *shared_envs
        BUNDLE_ID: 'is.island.app'
        APP_STORE_APPLE_ID: 1569828682
        APP_VARIANT: 'production'
    scripts:
      - *checkout_release_target
      - *pip_install
      - *npm_install
      - *codegen
      - *prebuild_ios
      - *cocoapods
      - *provisioning_profiles
      - *apply_release_ios_build_number
      - *build_ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      <<: *ios_release_testflight
      <<: *slack_errors

  mobile-release-android-dev:
    name: Island.is Mobile Release Android Dev (auto-release)
    max_build_duration: 120
    working_directory: apps/native/app
    instance_type: linux_x2
    cache: *android_cache
    environment:
      <<: *environment
      android_signing:
        - island-upload-keystore
      groups:
        - google_credentials
        - firebase_credentials_dev
      vars:
        <<: *shared_envs
        PACKAGE_NAME: 'is.island.app.dev'
        APP_VARIANT: 'development'
    scripts:
      - *checkout_release_target
      - *pip_install
      - *npm_install
      - *codegen
      - *apply_release_android_version_code
      - *prebuild_android
      - *set_android_location
      - *build_android
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      <<: *android_publishing
      <<: *slack_errors

  mobile-release-android-prod:
    name: Island.is Mobile Release Android Prod (auto-release)
    max_build_duration: 120
    working_directory: apps/native/app
    instance_type: linux_x2
    cache: *android_cache
    environment:
      <<: *environment
      android_signing:
        - island-upload-keystore
      groups:
        - google_credentials
        - firebase_credentials
      vars:
        <<: *shared_envs
        PACKAGE_NAME: 'is.island.app'
        APP_VARIANT: 'production'
    scripts:
      - *checkout_release_target
      - *pip_install
      - *npm_install
      - *codegen
      - *apply_release_android_version_code
      - *prebuild_android
      - *set_android_location
      - *build_android
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      <<: *android_publishing
      <<: *slack_errors
