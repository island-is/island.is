#
#####################################################################

global:
  env:
    AUDIT_GROUP_NAME: '/island-is/audit-log'
    AWS_REGION: 'eu-west-1'
    NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    PORT: '3333'
    name: 'staging'
  initContainer:
    env:
      AWS_REGION: 'eu-west-1'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
name: 'service-portal-metrics'
args:
  - 'main.cjs'
  - '--job=metrics'
command:
  - 'node'
concurrencyPolicy: 'Forbid'
enabled: true
env:
  CODE_OWNER: 'aranja'
  DB_HOST: 'postgres-applications.internal'
  DB_NAME: 'service_portal_api'
  DB_REPLICAS_HOST: 'postgres-applications.internal'
  DB_USER: 'service_portal_api'
  DD_TRACE_DISABLED_INSTRUMENTATIONS: 'fetch'
  LOG_LEVEL: 'info'
  NODE_OPTIONS: '--max-old-space-size=460 --enable-source-maps -r dd-trace/init'
  SERVERSIDE_FEATURES_ON: ''
grantNamespaces:
  - 'nginx-ingress-internal'
  - 'nginx-ingress-external'
  - 'islandis'
  - 'user-notification'
  - 'identity-server'
  - 'envoy-gateway-internal'
  - 'envoy-gateway-external'
grantNamespacesEnabled: true
healthCheck:
  liveness:
    initialDelaySeconds: 3
    path: '/'
    timeoutSeconds: 3
  readiness:
    initialDelaySeconds: 3
    path: '/'
    timeoutSeconds: 3
hpa:
  scaling:
    metric:
      cpuAverageUtilization: 90
      nginxRequestsIrate: 5
    replicas:
      max: 2
      min: 1
image:
  repository: '821090935708.dkr.ecr.eu-west-1.amazonaws.com/services-user-profile'
namespace: 'service-portal'
podDisruptionBudget:
  minAvailable: '50%'
  unhealthyPodEvictionPolicy: 'IfHealthyBudget'
podSecurityContext:
  fsGroup: 65534
pvcs: []
replicaCount:
  default: 1
  max: 2
  min: 1
resources:
  limits:
    cpu: '400m'
    memory: '512Mi'
  requests:
    cpu: '100m'
    memory: '256Mi'
schedule: '10 * * * *'
secrets:
  CONFIGCAT_SDK_KEY: '/k8s/configcat/CONFIGCAT_SDK_KEY'
  DB_PASS: '/k8s/service-portal-api/DB_PASSWORD'
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: 'arn:aws:iam::261174024191:role/service-portal-metrics'
  create: true
  name: 'service-portal-metrics'
startingDeadlineSeconds: 600
